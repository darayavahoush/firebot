[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firebot"
version = "0.1.0"
description = "Autonomous firefighting robot: simulation, sensor fusion, planning, fire-event database"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
firebot-sim = "firebot.sim.run:main"
firebot-train = "firebot.drl.train:main"
firebot-eval = "firebot.drl.evaluate:main"
firebot-plan = "firebot.planning.run:main"
firebot-cmd = "firebot.command.run:main"
firebot-listen = "firebot.speech.run:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
speech = ["vosk>=0.3.44", "sounddevice>=0.4"]
drl = ["gymnasium>=0.29", "stable-baselines3>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
firebot = ["db/migrations/*.sql", "db/training_migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["C408"]
