# Builds the Docker image on GitHub (free) and stores it in GitHub's registry, so Azure
# doesn't need a paid Container Registry. Tagged with the commit SHA.
name: image
on:
  push:
    branches: [main]
    paths: [Dockerfile, pyproject.toml, "src/**", "firebot-console/**"]
permissions:
  contents: read
  packages: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
